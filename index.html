<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplicativo EVANDRO</title>
    <link rel="manifest" href="manifest.json">

</head>
<body>
    <header>
        <h1>💚 Aplicativo EVANDRO</h1>

            <button>- Despesa</button>
