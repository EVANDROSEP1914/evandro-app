<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evandro App</title>
    <link rel="stylesheet" href="EVANDRO_APP_v0.2.0/css/style.css">
</head>
<body>
    <div class="container">
        <!-- Navegação de Mês -->
        <div class="header-mes">
            <button class="btn-nav" onclick="alterarMes(-1)">❮</button>
            <h2 id="labelMesAno">Carregando...</h2>
            <button class="btn-nav" onclick="alterarMes(1)">❯</button>
        </div>

        <!-- Resumo Financeiro -->
        <div class="resumo-cards">
            <div class="card pendente">
                <span>Pendente</span>
                <h3 id="totalPendente">R$ 0,00</h3>
            </div>
            <div class="card pago">
                <span>Pago</span>
                <h3 id="totalPago">R$ 0,00</h3>
            </div>
        </div>

        <!-- Formulário para adicionar conta -->
        <form id="formConta" class="form-conta">
            <input type="text" id="descConta" placeholder="Descrição da conta (ex: Luz)" required>
            <input type="number" id="valorConta" placeholder="Valor R$" step="0.01" required>
            <button type="submit">Adicionar</button>
        </form>

        <!-- Lista de Contas -->
        <div id="listaContas" class="lista-contas"></div>
    </div>

    <script src="EVANDRO_APP_v0.2.0/js/app.js"></script>
</body>
</html>
